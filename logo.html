<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  @font-face {
    font-family: 'LuckiestGuy';
    src: url('fonts/LuckiestGuy.ttf') format('truetype');
  }
  @font-face {
    font-family: 'FredokaOne';
    src: url('fonts/FredokaOne.ttf') format('truetype');
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1024px; height: 1024px; background: #000; overflow: hidden; }
  svg { width: 1024px; height: 1024px; }
</style>
</head>
<body>
<svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="orangeBg" cx="50%" cy="48%" r="52%">
      <stop offset="0%" style="stop-color:#FBBD3D"/>
      <stop offset="30%" style="stop-color:#F5A623"/>
      <stop offset="60%" style="stop-color:#EB9215"/>
      <stop offset="100%" style="stop-color:#D4800A"/>
    </radialGradient>

    <linearGradient id="badgeGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" style="stop-color:#7D4E30"/>
      <stop offset="15%" style="stop-color:#6B4025"/>
      <stop offset="45%" style="stop-color:#58341B"/>
      <stop offset="75%" style="stop-color:#482A14"/>
      <stop offset="100%" style="stop-color:#3C2210"/>
    </linearGradient>

    <linearGradient id="leaf1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7FCD82"/>
      <stop offset="50%" style="stop-color:#50B454"/>
      <stop offset="100%" style="stop-color:#2E8033"/>
    </linearGradient>
    <linearGradient id="leaf2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#90D893"/>
      <stop offset="50%" style="stop-color:#62C066"/>
      <stop offset="100%" style="stop-color:#3A9240"/>
    </linearGradient>
    <linearGradient id="leaf3" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" style="stop-color:#6BC770"/>
      <stop offset="100%" style="stop-color:#2B7A30"/>
    </linearGradient>
    <linearGradient id="leaf4" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#358A3A"/>
      <stop offset="50%" style="stop-color:#4DB052"/>
      <stop offset="100%" style="stop-color:#85CF88"/>
    </linearGradient>

    <linearGradient id="ribbonGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" style="stop-color:#70D474"/>
      <stop offset="20%" style="stop-color:#55BA59"/>
      <stop offset="70%" style="stop-color:#48AA4D"/>
      <stop offset="100%" style="stop-color:#3C9C42"/>
    </linearGradient>
    <linearGradient id="ribbonFold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2E7D32"/>
      <stop offset="100%" style="stop-color:#1B5E20"/>
    </linearGradient>

    <linearGradient id="bihariGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" style="stop-color:#FFE565"/>
      <stop offset="18%" style="stop-color:#FFD035"/>
      <stop offset="48%" style="stop-color:#F5A623"/>
      <stop offset="78%" style="stop-color:#E88500"/>
      <stop offset="100%" style="stop-color:#D56C00"/>
    </linearGradient>
    <linearGradient id="bitesGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" style="stop-color:#8ADE8E"/>
      <stop offset="25%" style="stop-color:#62C866"/>
      <stop offset="55%" style="stop-color:#4AB84E"/>
      <stop offset="100%" style="stop-color:#36A03B"/>
    </linearGradient>

    <linearGradient id="zigzagGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" style="stop-color:#D88010"/>
      <stop offset="50%" style="stop-color:#C47008"/>
      <stop offset="100%" style="stop-color:#A65D00"/>
    </linearGradient>

    <filter id="bigShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <filter id="textOuterShadow" x="-15%" y="-15%" width="130%" height="145%">
      <feDropShadow dx="0" dy="6" stdDeviation="4" flood-color="#050200" flood-opacity="0.8"/>
    </filter>
    <filter id="leafShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <filter id="ribbonShadow" x="-5%" y="-20%" width="110%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <filter id="sparkleGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2"/>
    </filter>

    <clipPath id="badgeClip">
      <path d="M230,295 C230,185 330,168 430,155 Q512,147 594,155 C694,168 794,185 794,295 L800,640 C800,712 720,732 620,747 Q512,757 404,747 C304,732 224,712 224,640Z"/>
    </clipPath>
  </defs>

  <rect width="1024" height="1024" fill="#000"/>

  <!-- Orange background circle -->
  <ellipse cx="512" cy="518" rx="372" ry="362" fill="url(#orangeBg)"/>

  <!-- Sparkle/burst effects -->
  <g filter="url(#sparkleGlow)">
    <circle cx="302" cy="168" r="8" fill="#FFD060"/>
    <circle cx="358" cy="142" r="5" fill="#FFB840"/>
    <circle cx="258" cy="192" r="6" fill="#FFD080"/>
    <circle cx="722" cy="168" r="8" fill="#FFD060"/>
    <circle cx="666" cy="142" r="5" fill="#FFB840"/>
    <circle cx="766" cy="192" r="6" fill="#FFD080"/>
  </g>
  <circle cx="302" cy="168" r="5.5" fill="#FFD860"/>
  <circle cx="358" cy="142" r="3.5" fill="#FFC040"/>
  <circle cx="258" cy="192" r="4.5" fill="#FFD880"/>
  <circle cx="722" cy="168" r="5.5" fill="#FFD860"/>
  <circle cx="666" cy="142" r="3.5" fill="#FFC040"/>
  <circle cx="766" cy="192" r="4.5" fill="#FFD880"/>
  <circle cx="332" cy="125" r="3.5" fill="#FFE8A0" opacity="0.7"/>
  <circle cx="692" cy="125" r="3.5" fill="#FFE8A0" opacity="0.7"/>
  <circle cx="430" cy="135" r="4.5" fill="#FFD060" opacity="0.55"/>
  <circle cx="594" cy="135" r="4.5" fill="#FFD060" opacity="0.55"/>

  <!-- LEFT LEAVES -->
  <g filter="url(#leafShadow)">
    <path d="M192,278 Q112,195 192,110 Q278,138 284,242 Q252,308 192,278Z" fill="url(#leaf1)" stroke="#267029" stroke-width="1.5"/>
    <path d="M242,205 Q214,158 192,110" stroke="#348A38" stroke-width="2.5" fill="none" opacity="0.5"/>

    <path d="M148,396 Q65,315 132,232 Q222,252 230,350 Q196,420 148,396Z" fill="url(#leaf2)" stroke="#267029" stroke-width="1.5"/>
    <path d="M188,306 Q156,265 132,232" stroke="#348A38" stroke-width="2.5" fill="none" opacity="0.5"/>

    <path d="M156,524 Q74,448 142,362 Q230,380 238,466 Q206,542 156,524Z" fill="url(#leaf3)" stroke="#267029" stroke-width="1.5"/>
    <path d="M196,432 Q166,395 142,362" stroke="#348A38" stroke-width="2.5" fill="none" opacity="0.5"/>

    <path d="M174,642 Q104,572 168,490 Q250,504 254,584 Q226,658 174,642Z" fill="url(#leaf4)" stroke="#267029" stroke-width="1.5"/>
    <path d="M216,548 Q190,516 168,490" stroke="#348A38" stroke-width="2.5" fill="none" opacity="0.5"/>
  </g>

  <!-- RIGHT LEAVES -->
  <g filter="url(#leafShadow)">
    <path d="M832,278 Q912,195 832,110 Q746,138 740,242 Q772,308 832,278Z" fill="url(#leaf2)" stroke="#267029" stroke-width="1.5"/>
    <path d="M782,205 Q810,158 832,110" stroke="#348A38" stroke-width="2.5" fill="none" opacity="0.5"/>

    <path d="M876,396 Q959,315 892,232 Q802,252 794,350 Q828,420 876,396Z" fill="url(#leaf1)" stroke="#267029" stroke-width="1.5"/>
    <path d="M836,306 Q868,265 892,232" stroke="#348A38" stroke-width="2.5" fill="none" opacity="0.5"/>

    <path d="M868,524 Q950,448 882,362 Q794,380 786,466 Q818,542 868,524Z" fill="url(#leaf4)" stroke="#267029" stroke-width="1.5"/>
    <path d="M828,432 Q858,395 882,362" stroke="#348A38" stroke-width="2.5" fill="none" opacity="0.5"/>

    <path d="M850,642 Q920,572 856,490 Q774,504 770,584 Q798,658 850,642Z" fill="url(#leaf3)" stroke="#267029" stroke-width="1.5"/>
    <path d="M808,548 Q834,516 856,490" stroke="#348A38" stroke-width="2.5" fill="none" opacity="0.5"/>
  </g>

  <!-- Main badge -->
  <g filter="url(#bigShadow)">
    <path d="M230,295 C230,185 330,168 430,155 Q512,147 594,155 C694,168 794,185 794,295 L800,640 C800,712 720,732 620,747 Q512,757 404,747 C304,732 224,712 224,640Z"
          fill="url(#badgeGrad)" stroke="#2A1808" stroke-width="5"/>
  </g>

  <!-- Zigzag wave -->
  <g clip-path="url(#badgeClip)">
    <path d="M224,636
      Q249,608 274,636 Q299,664 324,636 Q349,608 374,636 Q399,664 424,636 Q449,608 474,636 Q499,664 524,636 Q549,608 574,636 Q599,664 624,636 Q649,608 674,636 Q699,664 724,636 Q749,608 774,636 Q799,664 810,648
      L810,770 L220,770Z"
      fill="url(#zigzagGrad)" opacity="0.9"/>
  </g>

  <!-- "Bihari" text layers -->
  <text x="512" y="392" text-anchor="middle" dominant-baseline="central"
        font-family="LuckiestGuy, FredokaOne, Impact, sans-serif" font-size="152"
        fill="none" stroke="#120800" stroke-width="20" stroke-linejoin="round"
        filter="url(#textOuterShadow)">Bihari</text>
  <text x="512" y="392" text-anchor="middle" dominant-baseline="central"
        font-family="LuckiestGuy, FredokaOne, Impact, sans-serif" font-size="152"
        fill="none" stroke="#4A2810" stroke-width="10" stroke-linejoin="round">Bihari</text>
  <text x="512" y="392" text-anchor="middle" dominant-baseline="central"
        font-family="LuckiestGuy, FredokaOne, Impact, sans-serif" font-size="152"
        fill="url(#bihariGrad)">Bihari</text>

  <!-- "Bites" text layers -->
  <text x="512" y="545" text-anchor="middle" dominant-baseline="central"
        font-family="LuckiestGuy, FredokaOne, Impact, sans-serif" font-size="168"
        fill="none" stroke="#041006" stroke-width="20" stroke-linejoin="round"
        filter="url(#textOuterShadow)">Bites</text>
  <text x="512" y="545" text-anchor="middle" dominant-baseline="central"
        font-family="LuckiestGuy, FredokaOne, Impact, sans-serif" font-size="168"
        fill="none" stroke="#1A4020" stroke-width="10" stroke-linejoin="round">Bites</text>
  <text x="512" y="545" text-anchor="middle" dominant-baseline="central"
        font-family="LuckiestGuy, FredokaOne, Impact, sans-serif" font-size="168"
        fill="url(#bitesGrad)">Bites</text>

  <!-- Ribbon folds -->
  <polygon points="166,695 220,678 220,743 166,756" fill="url(#ribbonFold)"/>
  <polygon points="858,695 804,678 804,743 858,756" fill="url(#ribbonFold)"/>

  <!-- Main ribbon -->
  <g filter="url(#ribbonShadow)">
    <path d="M194,678 Q200,660 238,660 L786,660 Q824,660 830,678 L830,733 Q824,751 786,751 L238,751 Q200,751 194,733Z"
          fill="url(#ribbonGrad)" stroke="#2B7830" stroke-width="2.5"/>
    <line x1="236" y1="670" x2="788" y2="670" stroke="#88D88C" stroke-width="1.5" opacity="0.3"/>
  </g>

  <!-- Ribbon text -->
  <text x="512" y="714" text-anchor="middle" dominant-baseline="central"
        font-family="FredokaOne, LuckiestGuy, sans-serif" font-size="40" font-weight="bold"
        fill="#FFFDE7" letter-spacing="5">MAKHANA SNACKS!</text>

  <!-- Ribbon side dots -->
  <circle cx="250" cy="706" r="5.5" fill="#FFFDE7" opacity="0.85"/>
  <circle cx="774" cy="706" r="5.5" fill="#FFFDE7" opacity="0.85"/>
</svg>
</body>
</html>
